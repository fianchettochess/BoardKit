name: BoardKit — Release

# Publish a GitHub Release for an existing immutable N.N.N tag. BoardKit is a
# source package, so there is no binary asset. The exact tagged source is built
# and tested before the separate write-enabled publication job can run.

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing numeric SemVer tag to publish (for example, 0.6.0)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: BoardKit — validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Require strict numeric SemVer
        id: version
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be strict numeric SemVer (N.N.N): $VERSION" >&2
            exit 1
          fi
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    name: BoardKit — build/test exact release tag
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.0
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout exact BoardKit tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.version }}
          path: BoardKit
          fetch-depth: 0
          persist-credentials: false

      # The Swift container runs as a different user than the host checkout
      # process. Trust only this exact, ephemeral Actions workspace so Git can
      # validate the checked-out tag without weakening ownership checks more
      # broadly.
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}/BoardKit"

      - name: Configure private ChessCore access
        env:
          PACKAGE_TOKEN: ${{ secrets.DOCS_PACKAGES_TOKEN }}
        run: |
          if [[ -z "${PACKAGE_TOKEN}" ]]; then
            echo "DOCS_PACKAGES_TOKEN is required while ChessCore is private" >&2
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "${PACKAGE_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH_HEADER}"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${AUTH_HEADER}"
          } >> "${GITHUB_ENV}"

      - name: Verify checkout matches the tag
        id: tag
        working-directory: BoardKit
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$VERSION"
          TAG_COMMIT="$(git rev-parse "${VERSION}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          printf 'commit=%s\n' "$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      # Keep this version synchronized with the exact private-package pin in
      # Package.swift and exercise the standalone remote dependency path.
      - name: Resolve exact ChessCore 0.8.0
        working-directory: BoardKit
        run: |
          swift package resolve
          swift package resolve --version 0.8.0 ChessCore

      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test

  release:
    name: BoardKit — publish GitHub release
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish existing verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION")"
          REMOTE_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          REMOTE_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"

          # Annotated tags point to a tag object; peel it to the commit. Limit
          # the loop defensively in case a malformed tag chain is encountered.
          for _ in 1 2 3 4 5; do
            if [[ "$REMOTE_TYPE" != "tag" ]]; then
              break
            fi
            TAG_JSON="$(gh api "repos/$GH_REPO/git/tags/$REMOTE_SHA")"
            REMOTE_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
            REMOTE_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          done

          if [[ "$REMOTE_TYPE" != "commit" || "$REMOTE_SHA" != "$VERIFIED_COMMIT" ]]; then
            echo "tag $VERSION moved or no longer resolves to the verified commit" >&2
            echo "verified: $VERIFIED_COMMIT; remote: $REMOTE_TYPE $REMOTE_SHA" >&2
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "release $VERSION already exists — nothing to do"
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --title "BoardKit $VERSION" \
            --verify-tag \
            --generate-notes
