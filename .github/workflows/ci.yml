name: CI

# Build + test BoardKit on macOS (self-hosted Intel Mac Pro) and Linux
# (GitHub-hosted ubuntu-latest).
#
# BoardKit resolves its versioned ChessCore dependency exactly as a standalone
# public consumer does. Coordinated local development uses SwiftPM edit mode;
# CI intentionally exercises the remote dependency path.
#
# ARCH NOTE: the self-hosted runner is an Intel Mac Pro (x86_64).  BoardKit's
# library targets are platform-free.  The boardkit-emulator executable uses
# CoreBluetooth behind an #if os(macOS) && canImport(CoreBluetooth) guard,
# so it compiles on macOS and produces a no-op stub body on Linux (the library
# targets are platform-free and build identically on both hosts).
#
# GATED OFF — this workflow is manual-only because it includes a persistent
# self-hosted runner. Public pull requests run only ci-linux.yml on an ephemeral
# GitHub-hosted runner. To run this trusted workflow:
#   GitHub → Actions → CI → "Run workflow"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-self-hosted:
    name: macOS — self-hosted (Intel Mac Pro)
    # SECURITY: Before public visibility, restrict the organization runner
    # group to fianchettochess/BoardKit/.github/workflows/ci.yml@refs/heads/main.
    # These generic labels route jobs; they are not an authorization boundary.
    # Defense in depth: never schedule this job for a future non-manual trigger.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Checkout BoardKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: BoardKit
          persist-credentials: false
          set-safe-directory: false

      - name: Configure private package access when available
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DOCS_PACKAGES_TOKEN }}
        run: |
          if [[ -n "${PACKAGE_TOKEN}" ]]; then
            AUTH_HEADER="$(printf 'x-access-token:%s' "${PACKAGE_TOKEN}" | base64 | tr -d '\n')"
            echo "::add-mask::${AUTH_HEADER}"
            {
              echo 'GIT_CONFIG_COUNT=1'
              echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
              echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${AUTH_HEADER}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test

  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:latest
    steps:
      - name: Checkout BoardKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: BoardKit
          persist-credentials: false

      - name: Configure private package access when available
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DOCS_PACKAGES_TOKEN }}
        run: |
          if [[ -n "${PACKAGE_TOKEN}" ]]; then
            AUTH_HEADER="$(printf 'x-access-token:%s' "${PACKAGE_TOKEN}" | base64 | tr -d '\n')"
            echo "::add-mask::${AUTH_HEADER}"
            {
              echo 'GIT_CONFIG_COUNT=1'
              echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
              echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${AUTH_HEADER}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test
