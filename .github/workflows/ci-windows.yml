name: BoardKit — CI (Windows gate)

# WHY THIS EXISTS.
# BoardKit is pure, cross-platform Swift and carries the board seam every face depends on. It was
# measured green on Windows once, on 2026-08-01 (529 tests), and has not been gated there since —
# during which it gained an OpenChess adapter and a BLE surface. It also tracks `.replay` capture
# files that are UTF-8 TEXT with a semantically significant trailing newline, which is precisely what
# a CRLF checkout corrupts.
#
# Companion to the Linux gate, not a replacement. Windows runners cost about
# twice a Linux minute and the owner has accepted that; the alternative is a
# platform claimed in a README and measured nowhere, which is how FianchettoKit
# carried three unresolved Windows failures for a month across 291 commits.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: BoardKit — Windows gate / tests (Swift 6.3.3, x86_64-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Before any checkout. Windows runners set core.autocrlf=true globally, and
      # this package tracks files whose BYTES matter. `.gitattributes` is the
      # durable fix and lands with this change; this covers any repository the
      # job clones, including ones added later.
      - name: Never convert line endings, in any checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ChessCore is a PRIVATE repository, so this job cannot resolve the
      # manifest without a token — measured on the first Windows run
      # (33500405353): "error: Failed to clone repository
      # https://github.com/fianchettochess/ChessCore.git". The Linux gate has
      # carried this step all along; the Windows job was written without it.
      #
      # Dependabot-triggered runs read the DEPENDABOT secret scope rather than
      # the Actions one, so DOCS_PACKAGES_TOKEN must exist in BOTH or every
      # Dependabot PR fails here. Fail with a usable message rather than letting
      # swift build die on "could not read Username for https://github.com".
      - name: Configure private ChessCore access
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DOCS_PACKAGES_TOKEN }}
        run: |
          if [[ -z "${PACKAGE_TOKEN}" ]]; then
            echo "::error::DOCS_PACKAGES_TOKEN is unset. BoardKit cannot resolve" \
                 "the private ChessCore dependency without it."
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "${PACKAGE_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH_HEADER}"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${AUTH_HEADER}"
          } >> "${GITHUB_ENV}"

      # 6.3.3 is current and is the toolchain the Fianchetto stack's Windows
      # results were measured on. The Linux jobs deliberately pin the package's
      # declared MINIMUM to prove the floor still builds; this job is about
      # platform coverage, so it takes the ceiling. Pin the floor here only if
      # this becomes noise, never the ceiling — a consumer on Windows is ahead,
      # not behind.
      # continue-on-error IS NOT a weakened gate here, and the reason matters.
      # This action ends with its own `swift --version` check, which races its
      # own PATH refresh: the installer runs elevated as SYSTEM while Swift 6.3.3
      # installs per-user, so whether the toolchain bin has reached the Machine
      # or User environment block by the time the action looks is a coin toss.
      # MEASURED 2026-09-01: the identical workflow, action and inputs passed for
      # SwiftStockfish (run 33501874741) and failed for BoardKit (33501851591)
      # minutes apart, both with "The term 'swift' is not recognized".
      #
      # We fix PATH ourselves in the very next step and verify it in the one
      # after, so the authoritative signal moves from the action's racy internal
      # check to our own deterministic one. A genuine install failure still fails
      # the job — twice: the PATH step errors when swift.exe is nowhere under
      # either installation root, and the verify step errors when swift cannot
      # answer.
      - name: Install Swift toolchain
        continue-on-error: true
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      # Neither arrives on PATH by itself, measured on FianchettoKit CI
      # 2026-09-01: the installer runs elevated as SYSTEM while Swift installs
      # per-user, so the action's Machine/User PATH refresh misses the toolchain
      # bin; and mt.exe ships with the Windows SDK but only a Visual Studio
      # developer shell puts its directory on PATH.
      - name: Put the Swift toolchain and Windows SDK on PATH
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path $env:USERPROFILE "AppData\Local\Programs\Swift"),
            "C:\Program Files\Swift"
          ) | Where-Object { Test-Path $_ }
          if (-not $roots) {
            Write-Host "::error::No Swift installation root found."
            exit 1
          }
          $swift = $roots | ForEach-Object {
            Get-ChildItem $_ -Recurse -Filter swift.exe -ErrorAction SilentlyContinue
          } | Select-Object -First 1
          if (-not $swift) {
            Write-Host "::error::Swift installed but swift.exe was not found under: $($roots -join '; ')"
            exit 1
          }
          Write-Host "swift.exe: $($swift.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $swift.DirectoryName
          foreach ($root in $roots) {
            Get-ChildItem (Join-Path $root "Runtimes") -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $rt = Join-Path $_.FullName "usr\bin"
              if (Test-Path $rt) { Add-Content -Path $env:GITHUB_PATH -Value $rt }
            }
          }
          if (-not (Get-Command mt.exe -ErrorAction SilentlyContinue)) {
            $bin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
                     Where-Object { Test-Path (Join-Path $_.FullName "x64\mt.exe") } |
                     Sort-Object Name -Descending | Select-Object -First 1
            if ($bin) { Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $bin.FullName "x64") }
          }

      - name: Verify the toolchain answers
        shell: pwsh
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::swift --version exited $LASTEXITCODE after PATH setup."
            exit 1
          }

      # `.build` nests deeply on Windows and MAX_PATH is 260. This is the
      # machine half of the long-path pair; on a hosted runner we own the
      # machine, so we set it.
      - name: Enable long paths
        shell: pwsh
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true

      - name: Build
        run: swift build

      - name: Test
        run: swift test
