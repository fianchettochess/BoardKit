name: BoardKit — CI (routine Linux gate)

# Routine on-push gate on the free GitHub-hosted Linux runner, so every commit
# gets fast feedback without touching the shared self-hosted Mac Pro. BoardKit is
# cross-platform Swift (its CoreBluetooth/emulator code is `#if os(macOS)` /
# `#if canImport(Darwin)` guarded). The full macOS + Linux matrix stays in ci.yml
# (workflow_dispatch); this complements it for routine pushes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: BoardKit — routine gate / tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    steps:
      - name: Checkout BoardKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: BoardKit
          persist-credentials: false

      # ChessCore is PUBLIC as of 2026-09-07, so nothing here needs a token to
      # resolve it. This step used to inject DOCS_PACKAGES_TOKEN as a git auth
      # header, and release.yml hard-failed without it — which would now fail a
      # release for a secret that buys nothing. Removed rather than made
      # optional: dead credential plumbing is the kind of thing that gets
      # reinstated by cargo cult when someone sees an auth failure elsewhere.
      # (ChessCore made public 2026-09-07)
      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test
