name: CI (Linux — push gate)

# Routine on-push gate on the free GitHub-hosted Linux runner, so every commit
# gets fast feedback without touching the shared self-hosted Mac Pro. BoardKit is
# cross-platform Swift (its CoreBluetooth/emulator code is `#if os(macOS)` /
# `#if canImport(Darwin)` guarded). The full macOS + Linux matrix stays in ci.yml
# (workflow_dispatch); this complements it for routine pushes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ubuntu-latest) — swift test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:latest
    steps:
      # BoardKit's Package.swift resolves ChessCore from ../ChessCore when the
      # sibling is checked out. The optional PAT supports the pre-publication
      # transition; the built-in read-only token is sufficient once public.
      - name: Checkout ChessCore (sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fianchettochess/ChessCore
          path: ChessCore
          # Fork PRs do not receive repository secrets. Once ChessCore is
          # public, github.token is the safe read-only fallback for those PRs.
          token: ${{ secrets.SIBLINGS_CHECKOUT_PAT || github.token }}
          persist-credentials: false

      - name: Checkout BoardKit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: BoardKit
          persist-credentials: false

      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test
