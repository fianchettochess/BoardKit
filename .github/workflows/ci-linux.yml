name: BoardKit — CI (Linux push gate)

# Routine on-push gate on the free GitHub-hosted Linux runner, so every commit
# gets fast feedback without touching the shared self-hosted Mac Pro. BoardKit is
# cross-platform Swift (its CoreBluetooth/emulator code is `#if os(macOS)` /
# `#if canImport(Darwin)` guarded). The full macOS + Linux matrix stays in ci.yml
# (workflow_dispatch); this complements it for routine pushes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: BoardKit — tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    steps:
      - name: Checkout BoardKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: BoardKit
          persist-credentials: false

      - name: Configure private package access when available
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DOCS_PACKAGES_TOKEN }}
        run: |
          if [[ -n "${PACKAGE_TOKEN}" ]]; then
            AUTH_HEADER="$(printf 'x-access-token:%s' "${PACKAGE_TOKEN}" | base64 | tr -d '\n')"
            echo "::add-mask::${AUTH_HEADER}"
            {
              echo 'GIT_CONFIG_COUNT=1'
              echo 'GIT_CONFIG_KEY_0=http.https://github.com/.extraheader'
              echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic ${AUTH_HEADER}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Build
        working-directory: BoardKit
        run: swift build

      - name: Test
        working-directory: BoardKit
        run: swift test
